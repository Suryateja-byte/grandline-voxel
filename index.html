<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232fa8c4'/%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Grand Line — Voxel</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d1420;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f4e7c8}
  #app{position:fixed;inset:0}
  canvas#game{display:block;width:100%;height:100%;image-rendering:auto}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#0d1420;z-index:50}
  #boot .t{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
  #boot .bar{width:280px;height:6px;background:#22304a;border-radius:3px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:#e8b93c;transition:width .12s linear}
</style>
</head>
<body>
<div id="app"><canvas id="game"></canvas></div>
<div id="boot"><div class="t" id="bootText">charting the grand line</div><div class="bar"><i id="bootBar"></i></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
